name: Build Android APK via Container Engine
on: [push, pull_request]

jobs:
  build:
    # Use a pre-loaded container with stable Android build tools ready to go
    runs-on: ubuntu-22.04
    container:
      image: docker://gandreadis/buildozer:latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Run Direct Buildozer Android Compilation
      run: |
        # Accept the pre-installed developer licenses cleanly
        yes | sdkmanager --licenses || true
        
        # Package your video downloader using the container's stable architecture
        buildozer android debug
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGNER: 1
        HOME: /root

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Universal-Media-Downloader-APK
        path: bin/*.apk
