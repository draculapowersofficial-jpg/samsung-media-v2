name: Build Android APK via Direct Engine
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libltdl-dev ffmpeg git zip unzip
        pip install --upgrade pip
        # Installs classic stable compilers natively into the runner
        pip install "buildozer<=1.5.0" "cython<3.0.0" "sh==1.14.3"

    - name: Run Direct Android Compilation
      run: |
        # Accept the pre-installed developer licenses cleanly
        yes | sdkmanager --licenses || true
        
        # STABILITY FORCE: This explicit line forces buildozer to lock onto Python 3.10
        # and completely blocks it from downloading the experimental Python 3.14 alpha!
        buildozer android debug --app-requirements="python3==3.10.12,kivy==2.3.0,yt-dlp,certifi,openssl"
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGNER: 1
