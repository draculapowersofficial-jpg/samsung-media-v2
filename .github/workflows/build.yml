name: Build Android APK via Buildozer Kivy Engine
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libltdl-dev ffmpeg git zip unzip
        pip install --upgrade pip
        # Clean stability environment lock
        pip install "buildozer<=1.5.0" "cython<3.0.0" "sh==1.14.3"

    - name: Run Buildozer Android Compilation
      run: |
        # Reads your custom buildozer.spec directly out in the open without scrambled text alterations
        yes | sdkmanager --licenses || true
        buildozer android debug
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGNER: 1

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Universal-Media-Downloader-APK
        path: bin/*.apk
